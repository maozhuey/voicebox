# Voicebox — CPU build (default)
# For AMD ROCm GPU acceleration use the overlay:
#   docker compose -f docker-compose.yml -f docker-compose.rocm.yml up --build

services:
  voicebox:
    build: .
    container_name: voicebox
    restart: unless-stopped

    ports:
      # Host-side moved to 17600 so the dev/installed Voicebox can keep 17493.
      # Container still listens on its native port internally.
      - "127.0.0.1:17600:17493"

    volumes:
      # All local entry points must use one data source. On this Mac, ./data is
      # linked to the desktop app's standard data directory, so Docker sees the
      # same database, cloned profiles, samples, and generation history. Override
      # VOICEBOX_DATA_DIR only when intentionally selecting another complete data
      # directory; never mount generations separately because that would hide part
      # of the canonical dataset.
      - type: bind
        source: ${VOICEBOX_DATA_DIR:-./data}
        target: /app/data

      # HuggingFace model cache (so models aren't re-downloaded on rebuild)
      - huggingface-cache:/home/voicebox/.cache/huggingface

    environment:
      - LOG_LEVEL=info
      - NUMBA_CACHE_DIR=/tmp/numba_cache

    networks:
      - voicebox-net

    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

networks:
  voicebox-net:
    driver: bridge

volumes:
  huggingface-cache:
