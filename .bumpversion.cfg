[bumpversion]
current_version = 0.7.1
commit = True
tag = True
tag_name = v{new_version}
tag_message = 发布 v{new_version}
message = 发布版本：v{current_version} → v{new_version}

[bumpversion:file:tauri/src-tauri/tauri.conf.json]
search = "version": "{current_version}"
replace = "version": "{new_version}"

[bumpversion:file:tauri/src-tauri/Cargo.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file:package.json]
search = "version": "{current_version}"
replace = "version": "{new_version}"

[bumpversion:file:app/package.json]
search = "version": "{current_version}"
replace = "version": "{new_version}"

[bumpversion:file:tauri/package.json]
search = "version": "{current_version}"
replace = "version": "{new_version}"

[bumpversion:file:landing/package.json]
search = "version": "{current_version}"
replace = "version": "{new_version}"

[bumpversion:file:web/package.json]
search = "version": "{current_version}"
replace = "version": "{new_version}"

[bumpversion:file:backend/__init__.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"

[bumpversion:file:bun.lock]
search = "version": "{current_version}"
replace = "version": "{new_version}"

[bumpversion:file:docs/openapi.json]
search = "version":"{current_version}"
replace = "version":"{new_version}"

[bumpversion:file:docs/PROJECT_STATUS.md]
search = Current version: **v{current_version}**
replace = Current version: **v{new_version}**

[bumpversion:file:landing/src/components/CapturesMockup.tsx]
search = >v{current_version}<
replace = >v{new_version}<
